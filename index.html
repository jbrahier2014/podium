  <!-- Apply the saved theme before first paint. Arena (dark) is the default. -->
  <script>
    (function () {
      var t = 'dark';
      try {
        var s = JSON.parse(localStorage.getItem('podium.settings') || '{}');
        if (s.theme === 'light') t = 'light';
        else if (s.theme === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#F5F5F2' : '#111214');
    })();
  </script>
